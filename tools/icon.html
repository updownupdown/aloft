<!doctype html>
<!-- Renders the app icon, Aloft's mark (a hawk over the hills, web/3d/logo.js), with the game's own
     drawing code. Used by tools/make-icons.mjs, which calls render(size) for each icon size. -->
<html><head><style>
body { margin: 0; background: transparent; }
</style></head><body>
<canvas id="c" width="512" height="512"></canvas>
<script type="module">
import { drawLogo } from '../web/3d/logo.js';
window.render = size => {
  const c = document.getElementById('c'); c.width = c.height = size;
  drawLogo(c.getContext('2d'), size);
};
render(512);
window.done = true;
</script></body></html>

<!doctype html>
<!-- Renders the app icon, Aloft's wax seal on handmade paper, with the game's own drawing code.
     Used by tools/make-icons.mjs, which calls render(size) for each icon size. -->
<html><head><style>
@font-face { font-family: 'Spectral'; src: url(../web/fonts/spectral-regular.woff2) format('woff2'); }
body { margin: 0; background: #fff; }
</style></head><body>
<canvas id="c" width="512" height="512"></canvas>
<script type="module">
import { handmadeTex } from '../web/3d/paper.js';
import { drawSeal } from '../web/3d/seal.js';
await document.fonts.load('40px Spectral');
window.render = size => {
  const c = document.getElementById('c'); c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#efe5cf'; x.fillRect(0, 0, size, size);
  x.save(); x.globalCompositeOperation = 'multiply'; x.globalAlpha = .7; x.drawImage(handmadeTex(size, size, size / 160), 0, 0); x.restore();
  // a faint warm glow behind the seal, as on a sunny page
  const g = x.createRadialGradient(size * .42, size * .4, 0, size / 2, size / 2, size * .7);
  g.addColorStop(0, 'rgba(255,250,236,.5)'); g.addColorStop(1, 'rgba(255,250,236,0)'); x.fillStyle = g; x.fillRect(0, 0, size, size);
  drawSeal(x, size / 2, size * .49, size * (size < 64 ? .44 : .38));
};
render(512);
window.done = true;
</script></body></html>
